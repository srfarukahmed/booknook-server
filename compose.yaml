services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - booknook_mongo:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval ''try { if (!db.hello().setName) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}] }); } if (db.hello().isWritablePrimary) { quit(0); } quit(1); } catch (e) { quit(1); }''',
        ]
      interval: 3s
      timeout: 10s
      retries: 30
volumes:
  booknook_mongo:
